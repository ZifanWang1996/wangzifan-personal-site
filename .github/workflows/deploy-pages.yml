name: Verify and deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install pinned CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Build V11 public files
        run: python scripts/build_v11.py

      - name: Reject stale tracked public files
        run: git diff --exit-code -- index.html privacy.html assets/site.css assets/site.js assets/og-card.webp

      - name: Run Python contracts
        run: python -m pytest -q

      - name: Run focused interaction harness
        run: node tests/browser_interactions.mjs

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Check whitespace
        run: git diff --check

      - name: Create exact public artifact
        run: python scripts/prepare_public_artifact.py --output _site

      - name: Run real-browser acceptance matrix against exact artifact
        run: python scripts/accept_v11.py --site-dir _site --evidence-dir _qa/v11

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v11-browser-evidence-${{ github.run_id }}
          path: _qa/v11
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
