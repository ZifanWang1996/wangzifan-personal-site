name: Verify and deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (Node 24)

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7 (Node 24)
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 (Node 24)
        with:
          node-version: '22'

      - name: Install pinned CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Build V11 public files
        run: python scripts/build_v11.py

      - name: Reject stale tracked public files
        run: git diff --exit-code -- index.html privacy.html assets/site.css assets/site.js assets/og-card.webp

      - name: Run Python contracts
        run: python -m pytest -q

      - name: Run focused interaction harness
        run: node tests/browser_interactions.mjs

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Check whitespace
        run: git diff --check

      - name: Create exact public artifact
        run: python scripts/prepare_public_artifact.py --output _site

      - name: Run real-browser acceptance matrix against exact artifact
        run: python scripts/accept_v11.py --site-dir _site --evidence-dir _qa/v11

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 (Node 24)
        with:
          name: v11-browser-evidence-${{ github.run_id }}
          path: _qa/v11
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5 (Node 24)
